services:
  postgres:
    image: postgres:17-alpine
    container_name: homy-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: homy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - homy_data:/var/lib/postgresql/data

volumes:
  homy_data: